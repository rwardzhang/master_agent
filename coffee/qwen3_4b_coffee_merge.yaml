### 训练完成后,把 LoRA adapter 合并进底座,导出可直接部署的完整模型
### 用法: llamafactory-cli export qwen3_4b_coffee_merge.yaml

### model
model_name_or_path: $HUNYUAN_MODEL_PATH        # 底座: Qwen3-4B-Instruct-2507 本地路径
adapter_name_or_path: $HUNYUAN_CKPT_PATH       # 训练产出的 LoRA 目录(最优 ckpt)
template: qwen3
trust_remote_code: true

### export
export_dir: $HUNYUAN_MERGED_PATH               # 合并后完整模型输出目录
export_size: 4
export_device: cpu                             # cpu 合并最稳;有空闲显存可改 auto 加速
export_legacy_format: false
