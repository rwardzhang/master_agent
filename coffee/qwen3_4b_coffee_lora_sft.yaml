### model
model_name_or_path: $HUNYUAN_MODEL_PATH   # 指向 Qwen3-4B-Instruct-2507 的本地路径
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: lora
deepspeed: examples/deepspeed/ds_z2_config.json  # 4B 单机双卡用 ZeRO-2 即可,比 ZeRO-3 快;显存不够再换 z3
lora_rank: 16
lora_alpha: 32          # 一般取 2*rank,收敛更稳
lora_dropout: 0.05      # 小数据加一点 dropout 抗过拟合
lora_target: all

### dataset
dataset: $TAIJI_TRAIN_DATA_PATH
template: qwen3          # ★ Qwen3-4B-Instruct-2507 用 qwen3,不是 qwen3_nothink
cutoff_len: 1280         # ★ 实测样本 p99≈1080 token,1280 足够且零截断,省显存
overwrite_cache: true
preprocessing_num_workers: 16
dataloader_num_workers: 4

### output
output_dir: $HUNYUAN_CKPT_PATH
logging_steps: 5
save_strategy: epoch
plot_loss: true
overwrite_output_dir: true
save_only_model: true
report_to: tensorboard
logging_dir: $HUNYUAN_TF_EVENTS_PATH
save_total_limit: 4
load_best_model_at_end: true        # 配合 eval,自动保留验证集最优 ckpt
metric_for_best_model: eval_loss
greater_is_better: false

### train
per_device_train_batch_size: 16     # 2卡 * 16 * grad_accum 2 = 全局 batch 64
gradient_accumulation_steps: 2
learning_rate: 5.0e-5               # ★ 分类任务 LoRA 用 5e-5,1e-4 易过拟合
num_train_epochs: 3.0              # ★ 4 千条小数据 3 epoch 足够,看 eval 曲线决定早停
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_timeout: 180000000
resume_from_checkpoint: null

### eval
val_size: 0.1                      # ★ 必开!7分类+长尾,盲训无法判断过拟合
per_device_eval_batch_size: 16
eval_strategy: epoch               # 与 save_strategy 对齐,才能 load_best_model_at_end
